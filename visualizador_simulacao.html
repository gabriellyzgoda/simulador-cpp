<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simulação Gravitacional — Visualização</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #131924;
    --accent: #6ea8fe;
    --text: #e6edf3;
    --muted: #8b98a9;
    --border: #232b38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    min-height: 100vh;
  }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 4px; }
  p.subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; text-align: center; }
  #stage { background: #000; border: 1px solid var(--border); border-radius: 10px; max-width: 100%; }
  .panel {
    width: 100%; max-width: 760px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-top: 16px;
  }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }
  button {
    background: var(--accent); color: #08111f; border: none; border-radius: 8px;
    padding: 8px 16px; font-weight: 600; font-size: 0.9rem; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  input[type="file"] { color: var(--muted); font-size: 0.85rem; max-width: 220px; }
  label { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  #frameInfo { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; min-width: 130px; text-align: right; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #placeholder {
    color: var(--muted); font-size: 0.95rem; text-align: center; margin-top: 40px; max-width: 500px;
  }
  #status { font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>

<h1>Simulação Gravitacional de N-corpos</h1>
<p class="subtitle">Carregue o simulacao.csv gerado pelo seu programa em C++</p>

<div class="panel">
  <div class="row">
    <label for="fileInput">Arquivo CSV:</label>
    <input type="file" id="fileInput" accept=".csv">
    <span id="status">Nenhum arquivo carregado</span>
  </div>
</div>

<canvas id="stage" width="720" height="560" style="display:none;"></canvas>
<p id="placeholder">Selecione o arquivo <strong>simulacao.csv</strong> gerado pelo seu programa (mesma pasta onde o .exe foi rodado) para ver a animação.</p>

<div class="panel" id="controls" style="display:none;">
  <div class="row">
    <button id="playBtn">Pausar</button>
    <button class="secondary" id="restartBtn">Reiniciar</button>
    <button class="secondary" id="trailBtn">Rastro: Ligado</button>
    <span id="frameInfo">passo 0 / 0</span>
  </div>
  <div class="row">
    <label for="scrub">Progresso</label>
    <input type="range" id="scrub" min="0" max="0" value="0">
  </div>
  <div class="row">
    <label for="speed">Velocidade</label>
    <input type="range" id="speed" min="1" max="10" value="3">
    <label id="speedLabel" style="min-width:70px; text-align:right;">3 quadros/tick</label>
  </div>
  <div class="row legend" id="legend"></div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const cores = ['#ffd166', '#6ea8fe', '#ff6b6b', '#8ce99a', '#c084fc', '#f783ac'];

let FRAMES = null;
let frameIdx = 0;
let playing = true;
let speed = 3;
let showTrail = true;
let trailHistory = [];
let centerX, centerY, scale;

function parseCSV(text) {
  const linhas = text.trim().split('\n');
  const frames = {};
  for (let i = 1; i < linhas.length; i++) { // pula cabecalho
    const [passo, id, x, y] = linhas[i].split(',');
    const p = parseInt(passo, 10);
    if (!frames[p]) frames[p] = [];
    frames[p].push([parseInt(id, 10), parseFloat(x), parseFloat(y)]);
  }
  const passos = Object.keys(frames).map(Number).sort((a, b) => a - b);
  return passos.map(p => frames[p]);
}

function prepararCena(frames) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const frame of frames) {
    for (const [id, x, y] of frame) {
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
  }
  const rangeX = (maxX - minX) || 1;
  const rangeY = (maxY - minY) || 1;
  centerX = (minX + maxX) / 2;
  centerY = (minY + maxY) / 2;
  const range = Math.max(rangeX, rangeY) * 1.15;
  scale = Math.min(W, H) / range;
}

function project(x, y) {
  return [ W / 2 + (x - centerX) * scale, H / 2 - (y - centerY) * scale ];
}

function montarLegenda(numParticulas) {
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';
  for (let i = 0; i < numParticulas; i++) {
    const s = document.createElement('span');
    s.innerHTML = `<span class="dot" style="background:${cores[i % cores.length]}"></span> Partícula ${i}`;
    legendEl.appendChild(s);
  }
}

function draw() {
  if (!FRAMES) return;
  ctx.fillStyle = 'rgba(0,0,0,1)';
  ctx.fillRect(0, 0, W, H);

  if (showTrail) {
    trailHistory.push(FRAMES[frameIdx]);
    if (trailHistory.length > 120) trailHistory.shift();
    for (let h = 0; h < trailHistory.length; h++) {
      const alpha = (h / trailHistory.length) * 0.4;
      for (const [id, x, y] of trailHistory[h]) {
        const [px, py] = project(x, y);
        ctx.fillStyle = cores[id % cores.length];
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(px, py, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  const frame = FRAMES[frameIdx];
  for (const [id, x, y] of frame) {
    const [px, py] = project(x, y);
    const raio = id === 0 ? 9 : 5;
    ctx.fillStyle = cores[id % cores.length];
    ctx.beginPath();
    ctx.arc(px, py, raio, 0, Math.PI * 2);
    ctx.fill();
  }

  document.getElementById('frameInfo').textContent = `passo ${frameIdx} / ${FRAMES.length - 1}`;
  document.getElementById('scrub').value = frameIdx;
}

function tick() {
  if (playing && FRAMES) {
    frameIdx = (frameIdx + speed) % FRAMES.length;
    if (frameIdx < speed) trailHistory.length = 0;
  }
  draw();
  requestAnimationFrame(tick);
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    FRAMES = parseCSV(evt.target.result);
    prepararCena(FRAMES);
    frameIdx = 0;
    trailHistory = [];
    document.getElementById('status').textContent = `Carregado: ${file.name} (${FRAMES.length} quadros)`;
    document.getElementById('scrub').max = FRAMES.length - 1;
    montarLegenda(FRAMES[0].length);
    canvas.style.display = 'block';
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('controls').style.display = 'block';
  };
  reader.readAsText(file);
});

document.getElementById('playBtn').addEventListener('click', (e) => {
  playing = !playing;
  e.target.textContent = playing ? 'Pausar' : 'Continuar';
});

document.getElementById('restartBtn').addEventListener('click', () => {
  frameIdx = 0;
  trailHistory = [];
});

document.getElementById('trailBtn').addEventListener('click', (e) => {
  showTrail = !showTrail;
  trailHistory = [];
  e.target.textContent = 'Rastro: ' + (showTrail ? 'Ligado' : 'Desligado');
});

document.getElementById('scrub').addEventListener('input', (e) => {
  frameIdx = parseInt(e.target.value, 10);
  trailHistory = [];
});

document.getElementById('speed').addEventListener('input', (e) => {
  speed = parseInt(e.target.value, 10);
  document.getElementById('speedLabel').textContent = speed + ' quadros/tick';
});

requestAnimationFrame(tick);
</script>

</body>
</html>
